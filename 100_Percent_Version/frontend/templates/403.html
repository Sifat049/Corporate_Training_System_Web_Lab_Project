{% extends "base.html" %}
{% block title %}Access denied | Corporate Training{% endblock %}
{% block body %}
<div class="error-page">
  <div>
    <div class="code">403</div>
    <h1>Access denied</h1>
    <p class="muted">You do not have permission to open this page with your current role.</p>
    {% if user.is_authenticated %}
      <a class="btn btn-primary" href="{% url 'accounts:dashboard' %}">Go to my dashboard</a>
    {% else %}
      <a class="btn btn-primary" href="{% url 'accounts:login' %}">Go to login</a>
    {% endif %}
  </div>
</div>
{% endblock %}
