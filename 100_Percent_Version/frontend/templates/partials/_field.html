{# Reusable form field: {% include "partials/_field.html" with field=form.name %} #}
<div class="form-group {% if field.errors %}has-error{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="check-label" for="{{ field.id_for_label }}">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="req">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="help">{{ field.help_text|safe }}</small>{% endif %}
  {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
</div>
